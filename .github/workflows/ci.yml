# Quality gates on every PR into develop or main, plus a full run on every push to develop
# and once a week (ADR 0008). Rules, thresholds and reasons are in CONSTRAINTS.md; if this
# file and CONSTRAINTS.md disagree, CONSTRAINTS.md wins.
#
# `continue-on-error: true` marks the numeric rules that only warn until 2026-09-26 (T19
# removes it so they start blocking). The floor (lint-types, tests' pytest step, gitleaks,
# floor-guard) has no continue-on-error and blocks from day 1.
name: ci

on:
  pull_request:
    branches: [main, develop]
  # The impact map's safety net (ADR 0008): a push to develop and the weekly
  # schedule run everything, so a relationship the map misses still gets caught.
  push:
    branches: [develop]
  schedule:
    - cron: "0 6 * * 1" # Mondays, 06:00 UTC

permissions:
  contents: read

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  UV_VERSION: "0.12.13"
  # What the diff-based checks compare against. Outside a PR (push to develop,
  # weekly schedule) there is no base: they compare develop against itself, an
  # empty diff they pass trivially, while the full lint, type, test, security
  # and benchmark runs still happen.
  # Prefixed because a workflow-level `BASE_REF` is read by gitleaks-action as
  # its own scan range and breaks the security job ("Overriding baseRef for
  # scan with develop" -> `fatal: ambiguous argument 'develop^..<sha>'").
  PFP_BASE_REF: ${{ github.event.pull_request.base.ref || 'develop' }}

jobs:
  # Which expensive jobs this change affects (ADR 0008). The decision itself
  # lives in scripts/ci_impact.py, where tests/test_ci_impact.py can check it
  # without a live Actions run; this job only feeds it the diff.
  changes:
    name: changes
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      benchmarks: ${{ steps.impact.outputs.benchmarks }}
      integration: ${{ steps.impact.outputs.integration }}
      dbt_select: ${{ steps.impact.outputs.dbt_select }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: impact map
        id: impact
        run: |
          if [ "${{ github.event_name }}" = "pull_request" ]; then
            git fetch origin "$PFP_BASE_REF"
            git diff --name-only "origin/$PFP_BASE_REF...HEAD" \
              | python3 scripts/ci_impact.py >> "$GITHUB_OUTPUT"
          else
            {
              echo "benchmarks=true"
              echo "integration=true"
              echo "dbt_select=all"
            } >> "$GITHUB_OUTPUT"
          fi
          {
            echo "### changes (ADR 0008)"
            echo '```'
            cat "$GITHUB_OUTPUT"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"

  lint-types:
    name: lint-types
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - run: uv sync --locked
      - name: ruff check
        run: uv run ruff check --output-format=github .
      - name: ruff format
        run: uv run ruff format --check .
      - name: mypy
        run: |
          echo "::add-matcher::.github/matchers/mypy.json"
          uv run mypy .

  tests:
    name: tests
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - run: uv sync --locked
      # OCR fallback for scanned pages (T11b): GitHub-hosted Ubuntu runners have
      # passwordless sudo, and no build step needs Tesseract, only pytest.
      - name: install Tesseract OCR (Spanish)
        run: sudo apt-get update && sudo apt-get install -y tesseract-ocr tesseract-ocr-spa
      # Guarantees origin/<base> is resolvable regardless of what checkout's own
      # refspec fetched (see the same note in scripts/floor_guard.py's error message).
      - run: git fetch origin "$PFP_BASE_REF"
      - name: pytest
        run: |
          set -o pipefail
          uv run pytest --cov --cov-report=term-missing --cov-report=xml | tee pytest.log
          {
            echo "### pytest"
            echo '```'
            tail -n 5 pytest.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - name: diff-cover (warns until 2026-09-26, see CONSTRAINTS.md)
        continue-on-error: true
        run: >-
          uv run diff-cover coverage.xml
          --compare-branch="origin/$PFP_BASE_REF"
          --fail-under=80

  security:
    name: security
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - name: gitleaks
        uses: gitleaks/gitleaks-action@e0c47f4f8be36e29cdc102c57e68cb5cbf0e8d1e # v3.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - run: uv sync --locked
      - name: pip-audit (warns until 2026-09-26, see CONSTRAINTS.md)
        continue-on-error: true
        run: uv run pip-audit
      - name: bandit (warns until 2026-09-26, see CONSTRAINTS.md)
        continue-on-error: true
        run: uv run bandit -q -r . -x ./.venv --severity-level high

  architecture:
    name: architecture
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - run: uv sync --locked
      - name: import-linter (warns until 2026-09-26, see CONSTRAINTS.md)
        continue-on-error: true
        run: uv run lint-imports --no-logo

  floor-guard:
    name: floor-guard
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - run: uv sync --locked
      - run: git fetch origin "$PFP_BASE_REF"
      - run: uv run python scripts/floor_guard.py --base "origin/$PFP_BASE_REF"

  # Performance (CONSTRAINTS.md): the base branch and this change measured on
  # the same runner, minutes apart, with only ingestion/ and lakehouse/ swapped
  # between the two runs — same benchmark code, same dependencies, same machine.
  benchmarks:
    name: benchmarks
    needs: changes
    if: needs.changes.outputs.benchmarks == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - run: uv sync --locked
      - name: check out the base branch's code
        run: |
          git fetch origin "$PFP_BASE_REF"
          git checkout "origin/$PFP_BASE_REF" -- ingestion lakehouse
      # 10 rounds, not pytest-benchmark's default 5: two runs of the *same*
      # code came out 17% apart at 5 rounds and ~3% apart at 10, and a 20%
      # gate on a number that noisy would be a coin toss.
      - name: measure the base branch
        continue-on-error: true
        run: uv run pytest -m benchmark -q --benchmark-min-rounds=10 --benchmark-save=base
      # Always, so a failed base measurement can never leave the comparison
      # measuring the base branch against itself.
      - name: restore this change's code
        if: always()
        run: git checkout HEAD -- ingestion lakehouse
      - name: compare (warns until 2026-09-26, see CONSTRAINTS.md)
        continue-on-error: true
        run: |
          set -o pipefail
          uv run pytest -m benchmark -q --benchmark-min-rounds=10 \
            --benchmark-compare --benchmark-compare-fail=mean:20% \
            | tee benchmarks.log && status=0 || status=$?
          {
            echo "### benchmarks (base vs this change)"
            echo '```'
            # The comparison table and any "Performance has regressed" line come
            # first; what follows a regression is pytest-benchmark's own traceback.
            head -n 40 benchmarks.log
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit $status

  # The ephemeral environment (T17, ADR 0007): local S3 up, the synthetic
  # fixture ingested twice (idempotency: the second run adds 0 rows), dbt build
  # (impact-narrowed per ADR 0008), sqlfluff, and the integration-marked tests
  # that only ever run here (CONSTRAINTS.md's exceptions table). Always torn
  # down, logs saved first so a failure stays reviewable once it's gone.
  ephemeral-integration:
    name: ephemeral-integration
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # No secrets (ADR 0007): SeaweedFS's identity here is a fixed, local-only,
    # non-real value -- the same shape as every developer's own .env, just
    # hardcoded so this job runs the same way on a PR from a fork.
    env:
      COMPOSE_PROJECT: pfp-pr-${{ github.event.pull_request.number || github.run_id }}
      LAKEHOUSE_URI: s3://lakehouse
      AWS_ENDPOINT_URL: http://localhost:8333
      AWS_ACCESS_KEY_ID: pfp-ci-dummy-key
      AWS_SECRET_ACCESS_KEY: pfp-ci-dummy-secret
      AWS_REGION: us-east-1
      PFP_ACCOUNT_KEY: pfp-ci-dummy-account-key-0000000000000000
      PFP_USER: ci
      PFP_INBOX_ROOT: /tmp/pfp-ci-inbox
      PFP_ARCHIVE_ROOT: /tmp/pfp-ci-archive
      DBT_SELECT: ${{ needs.changes.outputs.dbt_select }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - run: uv sync --locked

      - name: bring up the ephemeral environment
        run: |
          docker compose -p "$COMPOSE_PROJECT" up -d --wait seaweedfs
          docker compose -p "$COMPOSE_PROJECT" run --rm bucket-init

      # Twice: the second pfp ingest must add 0 new rows to bronze, proving
      # ingestion is idempotent against the real platform, not a mock of it.
      # organize() (T12b) always moves a processed file out of the inbox, so
      # the fixture is re-seeded (byte-identical) before each run.
      - name: ingest the synthetic fixture (first pass)
        run: |
          uv run python -m scripts.seed_synthetic_inbox \
            --inbox-root "$PFP_INBOX_ROOT" --user "$PFP_USER"
          uv run pfp ingest --user "$PFP_USER" \
            --inbox-root "$PFP_INBOX_ROOT" --archive-root "$PFP_ARCHIVE_ROOT" \
            | tee /tmp/pfp-ci-ingest-1.log
      - name: ingest the synthetic fixture again (must add 0 rows)
        run: |
          uv run python -m scripts.seed_synthetic_inbox \
            --inbox-root "$PFP_INBOX_ROOT" --user "$PFP_USER"
          uv run pfp ingest --user "$PFP_USER" \
            --inbox-root "$PFP_INBOX_ROOT" --archive-root "$PFP_ARCHIVE_ROOT" \
            | tee /tmp/pfp-ci-ingest-2.log
          grep -q "Bronze: 0 statement(s) written" /tmp/pfp-ci-ingest-2.log

      # ADR 0008: a change confined to dbt/ builds only what it touched and its
      # descendants, compared against a manifest parsed from the base branch;
      # anything else (a parser, bronze, a dependency) builds everything, since
      # no state comparison can see what those change in the data.
      - name: dbt build
        run: |
          if [ "$DBT_SELECT" = "state:modified+" ]; then
            git fetch origin "$PFP_BASE_REF"
            git worktree add --detach /tmp/pfp-base-ref "origin/$PFP_BASE_REF"
            uv run dbt parse --project-dir /tmp/pfp-base-ref/dbt --profiles-dir dbt \
              --target-path /tmp/pfp-base-manifest
            uv run dbt build --project-dir dbt --profiles-dir dbt \
              --select "state:modified+" --state /tmp/pfp-base-manifest
          else
            uv run dbt build --project-dir dbt --profiles-dir dbt
          fi
      - run: uv run sqlfluff lint dbt/models
      - run: uv run pytest -m integration

      - name: save logs and dbt artifacts
        if: always()
        run: |
          mkdir -p /tmp/pfp-ci-artifacts
          docker compose -p "$COMPOSE_PROJECT" logs --no-color \
            > /tmp/pfp-ci-artifacts/docker-compose.log 2>&1 || true
          cp dbt/target/run_results.json /tmp/pfp-ci-artifacts/ 2>/dev/null || true
          cp dbt/logs/dbt.log /tmp/pfp-ci-artifacts/ 2>/dev/null || true
          cp /tmp/pfp-ci-ingest-1.log /tmp/pfp-ci-ingest-2.log /tmp/pfp-ci-artifacts/ \
            2>/dev/null || true
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        if: always()
        with:
          name: ephemeral-integration-logs
          path: /tmp/pfp-ci-artifacts
          retention-days: 3
          if-no-files-found: ignore

      - name: tear down the ephemeral environment
        if: always()
        run: docker compose -p "$COMPOSE_PROJECT" down -v

  # T17b: what dbt build actually *produces* differs between the base branch
  # and the PR, not just whether it succeeds -- the same gap ADR 0007's own
  # "Compare" bullet calls out. Runs ingest + dbt build twice against the same
  # SeaweedFS instance, isolated by a LAKEHOUSE_URI prefix and a
  # PFP_DUCKDB_PATH per run (ADR 0014), then diffs the two DuckDB files with
  # scripts/data_diff.py. Gated on the same `integration` output as
  # ephemeral-integration (same paths can change the data), and runs in
  # parallel with it, not after: the two jobs build into entirely separate
  # places, so there is nothing to wait for.
  #
  # Always a full `dbt build`, never DBT_SELECT's state:modified+: that
  # narrowing compares against a *persisted* target from a previous run, and
  # every run here starts from a brand new, empty DuckDB file -- selecting
  # only "what changed" against nothing already built would just leave most
  # models missing on one or both sides, not a meaningful comparison.
  #
  # Warn-only (T17b): job-level continue-on-error, and never added to the
  # ruleset's required checks (brain/components/ci.md) -- a real difference
  # between base and PR is expected and informative, and a broken base-branch
  # build shouldn't block a PR that never touched it either.
  pr-data-diff:
    name: pr-data-diff
    needs: changes
    if: needs.changes.outputs.integration == 'true'
    continue-on-error: true
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      COMPOSE_PROJECT: pfp-pr-diff-${{ github.event.pull_request.number || github.run_id }}
      AWS_ENDPOINT_URL: http://localhost:8333
      AWS_ACCESS_KEY_ID: pfp-ci-dummy-key
      AWS_SECRET_ACCESS_KEY: pfp-ci-dummy-secret
      AWS_REGION: us-east-1
      PFP_ACCOUNT_KEY: pfp-ci-dummy-account-key-0000000000000000
      PFP_USER: ci
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@bec219d24cd3e171d82865faccec33120bb574f4 # v10.1.0
        with:
          version: ${{ env.UV_VERSION }}
          python-version: "3.12"
      - run: uv sync --locked

      - name: bring up the ephemeral environment
        run: |
          docker compose -p "$COMPOSE_PROJECT" up -d --wait seaweedfs
          docker compose -p "$COMPOSE_PROJECT" run --rm bucket-init

      # ingestion/lakehouse: same idiom as the benchmarks job (T15), swap the
      # base ref's code in over the PR's -- safe there because Python only
      # ever executes what's reachable from an import, so a file the PR added
      # and base doesn't have just sits on disk, unused, once dispatcher.py
      # etc. are swapped back to their base versions.
      #
      # dbt/ is deliberately NOT swapped the same way: `git checkout <ref> --
      # dbt` only overwrites/creates paths <ref> has, it never deletes a path
      # the PR added that base doesn't -- and unlike Python's import graph,
      # dbt discovers every model by scanning models/ on disk, so a model file
      # the PR added would stay right there and get built into the "base"
      # run too, exactly the case this job most needs to catch. A worktree
      # instead (ADR 0013's own established pattern, same reasoning) always
      # contains exactly what the base ref has, nothing more.
      - name: check out the base branch's code
        run: |
          git fetch origin "$PFP_BASE_REF"
          git checkout "origin/$PFP_BASE_REF" -- ingestion lakehouse
          git worktree add --detach /tmp/pfp-diff-base-ref "origin/$PFP_BASE_REF"

      # continue-on-error so a broken base branch still lets the PR's own run
      # and the restore step happen: a failed base build is itself worth
      # surfacing in the log, not worth losing the rest of the job over.
      #
      # --profiles-dir stays the PR's own dbt/ (connection config, not
      # modeling -- same call ADR 0013 makes for the same reason).
      - name: base run (ingest + dbt build)
        continue-on-error: true
        env:
          LAKEHOUSE_URI: s3://lakehouse/pr-diff-base
          PFP_DUCKDB_PATH: /tmp/pfp-ci-diff-base.duckdb
          PFP_INBOX_ROOT: /tmp/pfp-ci-diff-base-inbox
          PFP_ARCHIVE_ROOT: /tmp/pfp-ci-diff-base-archive
        run: |
          uv run python -m scripts.seed_synthetic_inbox \
            --inbox-root "$PFP_INBOX_ROOT" --user "$PFP_USER"
          uv run pfp ingest --user "$PFP_USER" \
            --inbox-root "$PFP_INBOX_ROOT" --archive-root "$PFP_ARCHIVE_ROOT"
          uv run dbt build --project-dir /tmp/pfp-diff-base-ref/dbt --profiles-dir dbt

      # Always, so a failed base checkout or build can never leave this job
      # diffing the PR's own code against itself. Only ingestion/lakehouse
      # need restoring -- dbt/ was never swapped in place, it was built from
      # the worktree above.
      - name: restore the PR's code
        if: always()
        run: git checkout HEAD -- ingestion lakehouse

      - name: PR run (ingest + dbt build)
        continue-on-error: true
        env:
          LAKEHOUSE_URI: s3://lakehouse/pr-diff-pr
          PFP_DUCKDB_PATH: /tmp/pfp-ci-diff-pr.duckdb
          PFP_INBOX_ROOT: /tmp/pfp-ci-diff-pr-inbox
          PFP_ARCHIVE_ROOT: /tmp/pfp-ci-diff-pr-archive
        run: |
          uv run python -m scripts.seed_synthetic_inbox \
            --inbox-root "$PFP_INBOX_ROOT" --user "$PFP_USER"
          uv run pfp ingest --user "$PFP_USER" \
            --inbox-root "$PFP_INBOX_ROOT" --archive-root "$PFP_ARCHIVE_ROOT"
          uv run dbt build --project-dir dbt --profiles-dir dbt

      - name: base-vs-PR data diff
        run: |
          uv run python -m scripts.data_diff \
            --base /tmp/pfp-ci-diff-base.duckdb --pr /tmp/pfp-ci-diff-pr.duckdb \
            >> "$GITHUB_STEP_SUMMARY"

      - name: tear down the ephemeral environment
        if: always()
        run: docker compose -p "$COMPOSE_PROJECT" down -v
