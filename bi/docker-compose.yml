# Apache Superset: dashboards over PFP's gold schema (T32, ADR 0030), signed into through Dex
# (T39, ADR 0034) so each person logs in with their own email, added either by the operator
# (`make dex-add-user`, ADR 0039) or by themselves through dex-register (T40, ADR 0035), gated by an
# invite code.
#
# Part of the platform's one Compose project (T37, ADR 0032): the root docker-compose.yml
# includes this file and every service sits behind the `bi` profile, so `make up` starts
# them with storage and Postgres, and CI never does. They share the project's network: the
# read-only role `pfp_bi` reaches Postgres as `postgres:5432` and sees `gold` and nothing
# else. Superset's own metadata is in a separate `superset` database of that Postgres
# (init-metadata.sh). Only 8088 (Superset), 5556 (Dex) and 5559 (dex-register) are
# published, on 127.0.0.1; Dex's gRPC API (5557) never is -- see dex-register below.
#
# No `${VAR:-}` here: an included file is read even when its profile is off, so a required
# variable would break every project that does not use Superset. `make up` checks the
# required variables first (`make bi-check`).

services:
  # Dex (T39, ADR 0034): OpenID Connect provider so people sign in with their own email
  # instead of a shared admin password. Only Superset uses it today, so it sits in the `bi`
  # profile; OpenMetadata and Dagster are follow-up PRs. Config: ../dex/config.yaml.tpl.
  dex:
    profiles: ["bi"]
    image: ghcr.io/dexidp/dex:v2.43.1
    command: ["dex", "serve", "/etc/dex/config.yaml"]
    environment:
      PFP_BI_BASE_URL: http://localhost:${PFP_BI_PORT:-8088}
      PFP_BI_PUBLIC_URL: ${PFP_BI_PUBLIC_URL:-}
      # Where the login form's "Forgot your password?" / "Create an account" links go
      # (T43, ADR 0038): dex-register, public when there is a public URL.
      PFP_REGISTER_PUBLIC_URL: ${PFP_REGISTER_PUBLIC_URL:-http://localhost:${PFP_DEX_REGISTER_PORT:-5559}}
      # The upload portal's own OIDC client (T44, ADR 0040) and where it is reachable.
      PFP_UPLOAD_OAUTH_CLIENT_SECRET: ${PFP_UPLOAD_OAUTH_CLIENT_SECRET:-}
      PFP_UPLOAD_BASE_URL: http://localhost:${PFP_UPLOAD_PORT:-5560}
      PFP_UPLOAD_PUBLIC_URL: ${PFP_UPLOAD_PUBLIC_URL:-}
      PFP_BI_OAUTH_CLIENT_SECRET: ${PFP_BI_OAUTH_CLIENT_SECRET:-}
    ports:
      - "127.0.0.1:${PFP_DEX_PORT:-5556}:5556"
    volumes:
      - ../dex/config.yaml.tpl:/etc/dex/config.yaml:ro
      - ../dex/templates/password.html:/srv/dex/web/templates/password.html:ro
      - dex-data:/var/dex
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:5556/dex/healthz"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 20s

  # dex-register (T40, ADR 0035): a friendly sign-up page instead of `make dex-add-user`,
  # gated by a shared invite code (PFP_DEX_INVITE_CODE) so a public URL (a Cloudflare
  # Tunnel, the `cloudflared` service below) doesn't let a stranger create an account.
  # Creates the person straight in Dex's storage over its gRPC API -- reachable only from
  # here, over the compose network (never a published port): that API has full control
  # over every account.
  dex-register:
    profiles: ["bi"]
    build: ../dex-register
    image: pfp-dex-register:1.0.0
    depends_on:
      dex:
        condition: service_healthy
    environment:
      PFP_DEX_INVITE_CODE: ${PFP_DEX_INVITE_CODE:-}
      PFP_DEX_GRPC_ADDR: dex:5557
      # Password reset by email (T43, ADR 0038): the link's public address, and the same
      # SMTP the alerting uses (Phase 7). Either empty: the page says reset is not set up.
      PFP_REGISTER_PUBLIC_URL: ${PFP_REGISTER_PUBLIC_URL:-}
      ALERT_SMTP_HOST: ${ALERT_SMTP_HOST:-}
      ALERT_SMTP_PORT: ${ALERT_SMTP_PORT:-}
      ALERT_SMTP_USER: ${ALERT_SMTP_USER:-}
      ALERT_SMTP_PASSWORD: ${ALERT_SMTP_PASSWORD:-}
      ALERT_EMAIL_FROM: ${ALERT_EMAIL_FROM:-}
    ports:
      - "127.0.0.1:${PFP_DEX_REGISTER_PORT:-5559}:5559"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:5559/')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  # Upload portal (T44, ADR 0040): signed-in people send their bank statements; each is
  # unlocked with the password typed for it (never stored) and saved in that person's
  # folder of the inbox, for the owner to process with `pfp ingest`. Signs in through Dex
  # (client `portal`) and, for an account nobody scoped yet, gives it a user_id over Dex's
  # gRPC API. The inbox is the owner's own folder, mounted read-write.
  upload:
    profiles: ["bi"]
    build:
      context: ..
      dockerfile: upload/Dockerfile
    image: pfp-upload:1.0.0
    # The host user's id, so the files it writes are the owner's own on the host.
    user: "${PFP_UID:-1000}:${PFP_GID:-1000}"
    depends_on:
      dex:
        condition: service_healthy
    environment:
      PFP_UPLOAD_SECRET_KEY: ${PFP_UPLOAD_SECRET_KEY:-}
      PFP_UPLOAD_OAUTH_CLIENT_SECRET: ${PFP_UPLOAD_OAUTH_CLIENT_SECRET:-}
      PFP_UPLOAD_PUBLIC_URL: ${PFP_UPLOAD_PUBLIC_URL:-}
      PFP_BI_PUBLIC_URL: ${PFP_BI_PUBLIC_URL:-}
      DEX_ISSUER: ${DEX_ISSUER:-}
      PFP_DEX_GRPC_ADDR: dex:5557
      PFP_INBOX_ROOT: /inbox
    ports:
      - "127.0.0.1:${PFP_UPLOAD_PORT:-5560}:5560"
    volumes:
      - ${PFP_INBOX_DIR:-${HOME}/finance-data/inbox}:/inbox
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request as u; u.urlopen('http://localhost:5560/health')"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

  bi-init:
    profiles: ["bi"]
    # It runs psql against PFP's Postgres, defined in the root file of this same project:
    # wait until that one is accepting connections.
    depends_on:
      postgres:
        condition: service_healthy
    image: postgres:16.10-alpine
    entrypoint: ["/bin/sh", "/init-metadata.sh"]
    environment:
      PGPASSWORD: ${PFP_PG_PASSWORD:-}
      PFP_PG_USER: ${PFP_PG_USER:-}
      PFP_PG_DATABASE: ${PFP_PG_DATABASE:-}
      PFP_BI_DB_PASSWORD: ${PFP_BI_DB_PASSWORD:-}
    volumes:
      - ./init-metadata.sh:/init-metadata.sh:ro

  superset:
    profiles: ["bi"]
    build: .
    image: pfp-superset:5.0.0
    depends_on:
      bi-init:
        condition: service_completed_successfully
      dex:
        condition: service_healthy
    entrypoint: ["/bin/sh", "/app/start.sh"]
    environment:
      SUPERSET_CONFIG_PATH: /app/superset_config.py
      SUPERSET_SECRET_KEY: ${PFP_BI_SECRET_KEY:-}
      PFP_BI_DB_PASSWORD: ${PFP_BI_DB_PASSWORD:-}
      PFP_BI_ADMIN_PASSWORD: ${PFP_BI_ADMIN_PASSWORD:-}
      PFP_PG_BI_PASSWORD: ${PFP_PG_BI_PASSWORD:-}
      PFP_BI_OAUTH_CLIENT_SECRET: ${PFP_BI_OAUTH_CLIENT_SECRET:-}
      # The one URL a browser needs: Dex's own issuer (dex/config.yaml.tpl) is the internal
      # address, unreachable from outside the compose network, so this -- published, offset
      # in dev/prod like every other port (ADR 0033) -- is what bi/superset_config.py sends
      # a signing-in browser to instead.
      DEX_ISSUER: ${DEX_ISSUER:-}
      # Row-level data (T41, ADR 0036): whoever signs in with this email gets Admin
      # (sees everything); everyone else gets Gamma, filtered to their own user_id.
      PFP_BI_OWNER_EMAIL: ${PFP_BI_OWNER_EMAIL:-}
      # Public URL (T42, ADR 0037): empty means local only.
      PFP_BI_PUBLIC_URL: ${PFP_BI_PUBLIC_URL:-}
    ports:
      - "127.0.0.1:${PFP_BI_PORT:-8088}:8088"
    volumes:
      - ./superset_config.py:/app/superset_config.py:ro
      - ./start.sh:/app/start.sh:ro
      - ./cleanup_stale.py:/app/bi-cleanup.py:ro
      - ./setup_access.py:/app/setup_access.py:ro
      - ./assets:/app/pfp-assets:ro
    healthcheck:
      test: ["CMD", "curl", "-fs", "http://localhost:8088/health"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  # Cloudflare Tunnel connector (T42, ADR 0037): the public URL, without opening a port on
  # your router. Behind its own `tunnel` profile, which `make up` turns on only when
  # PFP_TUNNEL_TOKEN is set. It shares this project's network, so the routes you add on
  # Cloudflare (Networks > Tunnels > Public Hostname) point at the container names:
  # http://superset:8088, http://dex:5556, http://dex-register:5559.
  cloudflared:
    profiles: ["tunnel"]
    image: cloudflare/cloudflared:2026.9.3
    command: ["tunnel", "--no-autoupdate", "--metrics", "0.0.0.0:2000", "run"]
    environment:
      TUNNEL_TOKEN: ${PFP_TUNNEL_TOKEN:-}
    depends_on:
      superset:
        condition: service_healthy
      dex:
        condition: service_healthy
      dex-register:
        condition: service_healthy
      upload:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "cloudflared", "tunnel", "--metrics", "localhost:2000", "ready"]
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 10s

volumes:
  dex-data:
