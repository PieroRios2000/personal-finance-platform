slice_name: Cash flow summary
description: null
certified_by: null
certification_details: null
viz_type: handlebars
params:
  query_mode: aggregate
  groupby: []
  metrics:
  - expressionType: SQL
    sqlExpression: MAX(currency)
    label: currency
  - expressionType: SQL
    sqlExpression: to_char(COALESCE(SUM(ABS(amount)) FILTER (WHERE flow_type = 'ingreso'
      AND NOT is_internal_transfer), 0), 'FM999,999,999,990.00')
    label: income
  - expressionType: SQL
    sqlExpression: to_char(COALESCE(SUM(ABS(amount)) FILTER (WHERE flow_type = 'egreso'
      AND NOT is_internal_transfer), 0), 'FM999,999,999,990.00')
    label: spending
  - expressionType: SQL
    sqlExpression: to_char((COALESCE(SUM(ABS(amount)) FILTER (WHERE flow_type = 'ingreso'
      AND NOT is_internal_transfer), 0) - COALESCE(SUM(ABS(amount)) FILTER (WHERE
      flow_type = 'egreso' AND NOT is_internal_transfer), 0)), 'FM999,999,999,990.00')
    label: net
  - expressionType: SQL
    sqlExpression: CASE WHEN (COALESCE(SUM(ABS(amount)) FILTER (WHERE flow_type =
      'ingreso' AND NOT is_internal_transfer), 0) - COALESCE(SUM(ABS(amount)) FILTER
      (WHERE flow_type = 'egreso' AND NOT is_internal_transfer), 0)) >= 0 THEN 1 ELSE
      0 END
    label: net_positive
  - expressionType: SQL
    sqlExpression: to_char(CASE WHEN COALESCE(SUM(ABS(amount)) FILTER (WHERE flow_type
      = 'ingreso' AND NOT is_internal_transfer), 0) = 0 THEN 0 ELSE 100 * (COALESCE(SUM(ABS(amount))
      FILTER (WHERE flow_type = 'ingreso' AND NOT is_internal_transfer), 0) - COALESCE(SUM(ABS(amount))
      FILTER (WHERE flow_type = 'egreso' AND NOT is_internal_transfer), 0)) / COALESCE(SUM(ABS(amount))
      FILTER (WHERE flow_type = 'ingreso' AND NOT is_internal_transfer), 0) END, 'FM990.0')
    label: rate
  adhoc_filters:
  - expressionType: SIMPLE
    subject: date
    operator: TEMPORAL_RANGE
    comparator: No filter
    clause: WHERE
  row_limit: 1
  handlebarsTemplate: "{{#each data}}\n<div class=\"kpis\">\n  <div class=\"kpi income\"\
    ><div class=\"label\">Income</div>\n    <div class=\"value\">{{currency}} {{income}}</div><div\
    \ class=\"note\">without internal transfers</div></div>\n  <div class=\"kpi spend\"\
    ><div class=\"label\">Spending</div>\n    <div class=\"value\">{{currency}} {{spending}}</div><div\
    \ class=\"note\">without internal transfers</div></div>\n  <div class=\"kpi net\
    \ {{#if net_positive}}pos{{else}}neg{{/if}}\"><div class=\"label\">Net</div>\n\
    \    <div class=\"value\">{{currency}} {{net}}</div><div class=\"note\">income\
    \ minus spending</div></div>\n  <div class=\"kpi rate\"><div class=\"label\">Savings\
    \ rate</div>\n    <div class=\"value\">{{rate}}%</div><div class=\"note\">net\
    \ / income</div></div>\n</div>\n{{/each}}\n"
  styleTemplate: ".kpis { display: flex; gap: 10px; height: 100%; align-items: stretch;\
    \ font-family: inherit; }\n.kpi { flex: 1; border-radius: 12px; padding: 12px\
    \ 14px; display: flex;\n       flex-direction: column; justify-content: center;\
    \ background: #f7f9fc; border-left: 5px solid #98a2b3; }\n.kpi .label { font-size:\
    \ 12px; text-transform: uppercase; letter-spacing: .06em; color: #667085; }\n\
    .kpi .value { font-size: 21px; font-weight: 700; color: #1b2437; margin-top: 4px;\
    \ white-space: nowrap; }\n.kpi .note { font-size: 12px; color: #667085; margin-top:\
    \ 2px; }\n.kpi.income { border-left-color: #1f9d6b; } .kpi.spend { border-left-color:\
    \ #e5484d; }\n.kpi.net.pos { border-left-color: #1f9d6b; } .kpi.net.neg { border-left-color:\
    \ #e5484d; }\n.kpi.net.pos .value { color: #1f9d6b; } .kpi.net.neg .value { color:\
    \ #e5484d; }\n.kpi.rate { border-left-color: #6366f1; }\n.kpi.bal { border-left-color:\
    \ #0ea5e9; }\n.kpi .up { color: #1f9d6b; } .kpi .down { color: #e5484d; }\n"
  datasource: 1__table
  viz_type: handlebars
query_context: null
cache_timeout: null
