slice_name: Upload your files
description: null
certified_by: null
certification_details: null
viz_type: handlebars
params:
  query_mode: aggregate
  groupby: []
  metrics:
  - expressionType: SQL
    sqlExpression: COUNT(*)
    label: movements
  - expressionType: SQL
    sqlExpression: '''{{ upload_url() }}''::text'
    label: upload_url
  adhoc_filters: []
  row_limit: 1
  handlebarsTemplate: "{{#each data}}\n<div class=\"upload\">\n{{#if movements}}\n  <div class=\"row\"><span class=\"text\">Have more statements?</span>\n    <a class=\"btn small\" href=\"{{upload_url}}\" target=\"_blank\" rel=\"noopener\">Upload your files</a></div>\n{{else}}\n  <div class=\"title\">No data yet</div>\n  <div class=\"text\">Send your bank statements and they will show up here once they have been processed.</div>\n  <a class=\"btn\" href=\"{{upload_url}}\" target=\"_blank\" rel=\"noopener\">Upload your files</a>\n{{/if}}\n</div>\n{{/each}}\n"
  styleTemplate: ".upload { display: flex; flex-direction: column; gap: 6px; height: 100%; justify-content: center;\n          padding: 8px 14px; font-family: inherit; }\n.upload .title { font-size: 18px; font-weight: 700; color: #1b2437; }\n.upload .text { font-size: 13px; color: #667085; }\n.upload .row { display: flex; align-items: center; gap: 12px; }\n.upload .btn { align-self: flex-start; background: #6366f1; color: #fff !important; border-radius: 8px;\n               padding: 8px 16px; font-weight: 600; text-decoration: none; }\n.upload .btn.small { padding: 4px 12px; font-size: 12px; }\n"
  datasource: 11__table
  viz_type: handlebars
