slice_name: Emergency fund
description: null
certified_by: null
certification_details: null
viz_type: handlebars
params:
  query_mode: aggregate
  groupby: []
  metrics:
  - expressionType: SQL
    sqlExpression: '''US$ '' || to_char(MAX(emergency_target), ''FM999,999,999,990.00'')'
    label: target
  - expressionType: SQL
    sqlExpression: '''US$ '' || to_char(MAX(emergency_now), ''FM999,999,999,990.00'')'
    label: bucket
  - expressionType: SQL
    sqlExpression: '''US$ '' || to_char(MAX(emergency_gap), ''FM999,999,999,990.00'')'
    label: gap
  - expressionType: SQL
    sqlExpression: COALESCE(to_char(MAX(months_of_income), 'FM990.0'), '-')
    label: months_of_income
  - expressionType: SQL
    sqlExpression: COALESCE(to_char(MAX(months_covered), 'FM990.0'), '-')
    label: months_covered
  - expressionType: SQL
    sqlExpression: CASE WHEN MAX(emergency_gap) <= 0 THEN 1 ELSE 0 END
    label: filled
  - expressionType: SQL
    sqlExpression: CASE WHEN MAX(emergency_gap) <= 0 THEN 'already full' WHEN MAX(months_to_fill)
      IS NULL THEN 'not within 10 years' ELSE 'full in ' || MAX(months_to_fill) ||
      ' months (base pace)' END
    label: fill
  - expressionType: SQL
    sqlExpression: CASE WHEN BOOL_OR(essential_over_income) THEN 1 ELSE 0 END
    label: essential_over_income
  - expressionType: SQL
    sqlExpression: CASE WHEN BOOL_OR(target_over_two_years_income) THEN 1 ELSE 0 END
    label: target_over_two_years_income
  - expressionType: SQL
    sqlExpression: CASE WHEN BOOL_OR(balance_mismatch) THEN 1 ELSE 0 END
    label: balance_mismatch
  - expressionType: SQL
    sqlExpression: COALESCE(MAX(mismatch_months), 0)
    label: mismatch_months
  - expressionType: SQL
    sqlExpression: COALESCE(MAX(months_checked), 0)
    label: months_checked
  adhoc_filters:
  - expressionType: SQL
    sqlExpression: scenario = 'base'
    clause: WHERE
  row_limit: 1
  handlebarsTemplate: "{{#each data}}\n<div class=\"fund\">\n  <div class=\"kpis\"\
    >\n    <div class=\"kpi cap\"><div class=\"label\">Emergency target</div>\n  \
    \    <div class=\"value\">{{target}}</div>\n      <div class=\"note\">about {{months_of_income}}\
    \ months of your income</div></div>\n    <div class=\"kpi {{#if filled}}fund-ok{{else}}fund-gap{{/if}}\"\
    ><div class=\"label\">Emergency savings now</div>\n      <div class=\"value\"\
    >{{bucket}}</div>\n      <div class=\"note\">covers {{months_covered}} months</div></div>\n\
    \    <div class=\"kpi\"><div class=\"label\">Still to save</div>\n      <div class=\"\
    value\">{{gap}}</div>\n      <div class=\"note\">{{fill}}</div></div>\n  </div>\n\
    \  {{#if essential_over_income}}<div class=\"warn\">Essential spending is above\
    \ your income: at this pace the fund does not fill.</div>{{/if}}\n  {{#if target_over_two_years_income}}<div\
    \ class=\"warn\">The target is more than two years of income: check <b>emergency_months</b>\
    \ in the Meta sheet.</div>{{/if}}\n  {{#if balance_mismatch}}<div class=\"warn\"\
    >Your balances did not follow income minus spending in {{mismatch_months}} of\
    \ the last {{months_checked}} months: some money moves outside the statements\
    \ loaded.</div>{{/if}}\n</div>\n{{/each}}\n"
