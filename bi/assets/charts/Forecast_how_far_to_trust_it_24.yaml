slice_name: 'Forecast: how far to trust it'
description: null
certified_by: null
certification_details: null
viz_type: handlebars
params:
  query_mode: aggregate
  groupby:
  - category
  - currency
  - model_name
  - baseline_used
  - low_history
  - n_months
  - expressionType: SQL
    sqlExpression: COALESCE(to_char(mae_rel * 100, 'FM990') || '%', '-')
    label: mae
  - expressionType: SQL
    sqlExpression: COALESCE(to_char(coverage * 100, 'FM990') || '%', '-')
    label: inside
  metrics:
  - expressionType: SQL
    sqlExpression: SUM(p50)
    label: sort_key
  timeseries_limit_metric:
    expressionType: SQL
    sqlExpression: SUM(p50)
    label: sort_key
  order_desc: true
  adhoc_filters: []
  row_limit: 500
