    >Typical miss</th><th class=\"num\">Inside the range</th></tr>\n  </thead>\n \
    \ <tbody>\n  {{#each data}}\n    <tr>\n      <td>{{category}}</td><td>{{currency}}</td>\n\
    \      <td>{{#if baseline_used}}<span class=\"badge baseline\">median baseline</span>{{else}}<span\
