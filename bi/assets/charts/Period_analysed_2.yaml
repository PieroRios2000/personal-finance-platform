slice_name: Period analysed
description: null
certified_by: null
certification_details: null
viz_type: handlebars
params:
  query_mode: aggregate
  groupby: []
  metrics:
  - expressionType: SQL
    sqlExpression: to_char(MIN(date), 'DD Mon YYYY')
    label: from
  - expressionType: SQL
    sqlExpression: to_char(MAX(date), 'DD Mon YYYY')
    label: to
  - expressionType: SQL
    sqlExpression: COUNT(DISTINCT calendar_month)
    label: months
  adhoc_filters:
  - expressionType: SIMPLE
    subject: date
    operator: TEMPORAL_RANGE
    comparator: No filter
    clause: WHERE
  row_limit: 1
  handlebarsTemplate: "{{#each data}}\n<div class=\"kpis\">\n  <div class=\"kpi range\"\
    ><div class=\"label\">Period analysed</div>\n    <div class=\"value small\">{{from}}\
    \ &rarr; {{to}}</div>\n    <div class=\"note\">{{months}} closed month(s), from\
    \ the movements you have filtered</div></div>\n</div>\n{{/each}}\n"
  styleTemplate: ".kpis { display: flex; gap: 10px; height: 100%; align-items: stretch;\
    \ font-family: inherit; }\n.kpi { flex: 1; border-radius: 12px; padding: 12px\
