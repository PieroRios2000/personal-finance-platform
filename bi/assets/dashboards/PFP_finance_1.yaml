  MARKDOWN-forecast:
    type: MARKDOWN
    id: MARKDOWN-forecast
    children: []
    parents:
    - ROOT_ID
    - GRID_ID
    - ROW-12
    meta:
      width: 4
      height: 34
      code: '### How to read the forecast and the goal


        - Everything about the goal is in **US$**, at the `usd_to_pen` rate you set
        in the Meta sheet.

        - **Optimistic, base and cautious** are three sets of assumptions (low, median
        and high spending; high, median and low income), not a confidence interval.

        - The last forecast month is held flat after three months, and the investments
        are held flat at their last valuation.

        - Savings in the emergency account fill the emergency fund; new savings fill
        it first, then go to the goal.

        - **Forecast: how far to trust it** marks the categories that keep the **median
        baseline**: no model beat it in the backtest.


        The date range does not apply here: these tables look ahead.'
