    - ROW-10
    meta:
      width: 4
      height: 50
      code: '### How to read the returns


        - **valuation**: the month closed at a real month-end value.

        - **last_movement**: only the balance at the last movement; the return is
        shown but trust it less.


        A return is shown only for a *reliable* month (`is_return_reliable`); the
        gain and the balances are always there.


        One currency at a time: use the **Currency** filter.'
