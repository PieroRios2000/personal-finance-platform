[project]
name = "personal-finance-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "dagster>=1.13.23",
    "dagster-dbt>=0.29.23",
    "dbt-duckdb>=1.11.0",
    "deltalake>=1.6.3",
    "duckdb>=1.5.5",
    "openpyxl>=3.1.5",
    "pdfplumber>=0.11.10",
    "pikepdf>=10.13.0.post1",
    "pyarrow>=25.0.1",
    "pydantic>=2.13.5",
    "pytesseract>=0.3.13",
]

[project.scripts]
pfp = "ingestion.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingestion", "lakehouse", "scripts", "orchestration", "alerting"]

# `dagster dev`'s own auto-discovery (T21): this block is what lets the local web UI
# find orchestration/definitions.py with no flag. `dagster asset materialize`/`dagster
# asset list` -- the commands CI and a one-shot run actually use -- resolve their
# target through a different code path this block does NOT drive; they need
# DAGSTER_MODULE_NAME set instead (.env.example, SETUP.md section 9) -- see
# orchestration/definitions.py and brain/components/dagster.md.
[tool.dagster]
module_name = "orchestration.definitions"

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "diff-cover>=10.5.1",
    "elementary-data>=0.26.0",
    "fpdf2>=2.8.8",
    "import-linter>=2.15",
    "mypy>=2.3.1",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-benchmark>=5.3.0",
    "pytest-cov>=7.1.0",
    "pytest-xdist>=3.8.0",
    "ruff>=0.16.7",
    "sqlfluff>=4.3.0",
    "sqlfluff-templater-dbt>=4.3.0",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

# sqlfluff for the dbt project's SQL (T16). It lives here rather than in a
# `dbt/.sqlfluff` because sqlfluff refuses to take `templater` from a config file
# in a subdirectory of the working directory ("Templater cannot be set in a
# .sqlfluff file in a subdirectory of the current working directory"), and
# because every other tool in this repo is configured from this one file.
# Run from the repository root: `uv run sqlfluff lint dbt/models`.
[tool.sqlfluff.core]
# The dbt templater, not the plain jinja one, so `source()` resolves to the real
# `delta_scan(...)` expression dbt-duckdb generates and the linter sees the SQL
# DuckDB will actually run. It needs the same environment variables `dbt build`
# does (see `dbt/profiles.yml`).
templater = "dbt"
dialect = "duckdb"
max_line_length = 100

[tool.sqlfluff.templater.dbt]
project_dir = "dbt"
profiles_dir = "dbt"

# Only the capitalisation policies are set: sqlfluff's default is "consistent",
# which accepts whichever style a new file happens to start with. Everything else
# (indentation, layout) keeps sqlfluff's defaults.
[tool.sqlfluff.rules.capitalisation.keywords]
capitalisation_policy = "lower"

[tool.sqlfluff.rules.capitalisation.functions]
extended_capitalisation_policy = "lower"

[tool.sqlfluff.rules.capitalisation.identifiers]
extended_capitalisation_policy = "lower"

[tool.sqlfluff.rules.capitalisation.literals]
capitalisation_policy = "lower"

[tool.sqlfluff.rules.capitalisation.types]
extended_capitalisation_policy = "lower"

[tool.mypy]
strict = true
# T22: dbt/dbt_packages/ (gitignored, dbt-deps-installed) ships elementary's own
# Python integration-test suite with no types of its own -- not this project's
# code, the same reason .venv/ is already outside mypy's scan (mypy's own
# implicit venv-skip, which only fires for an actual venv directory, not a
# dbt package). Scoped to that one path, not a blanket dbt/ exclude: dbt/*.py
# scripts, if this project ever adds any, should still be checked.
exclude = "^dbt/dbt_packages/"

# pytesseract and pyarrow ship no type stubs or py.typed marker (T11b, T14); no
# official types-pytesseract or types-pyarrow package exists on PyPI either, so
# this is the standard mypy escape hatch, scoped to just these two imports.
[[tool.mypy.overrides]]
module = ["pytesseract", "pyarrow", "pyarrow.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not real_pdf and not integration and not benchmark'"
markers = [
    "real_pdf: runs against the owner's real PDFs; deselected by default (ADR 0004). Run with `pytest -m real_pdf`.",
    "integration: needs local S3 (SeaweedFS, T13) running via `docker compose up`; deselected by default. Run with `pytest -m integration`.",
    "benchmark: measures performance instead of behavior (T15); deselected by default, since a timing is only meaningful against a baseline on the same machine. CI's `benchmarks` job runs them base vs PR on one runner. Run with `pytest -m benchmark`.",
]

[tool.coverage.run]
source = ["ingestion", "lakehouse", "scripts"]

# Architecture (reasons in CONSTRAINTS.md). Each contract forbids the whole package, and
# `ignore_imports` declares the one allowed dependency (T14): ingestion.cli orchestrates
# both organizer and bronze; lakehouse depends only on the schema, never on the parsers.
[tool.importlinter]
root_packages = ["ingestion", "lakehouse", "orchestration", "alerting"]

[[tool.importlinter.contracts]]
name = "Parsing does not import lakehouse (only ingestion.cli orchestrates both)"
type = "forbidden"
source_modules = ["ingestion"]
forbidden_modules = ["lakehouse"]
ignore_imports = ["ingestion.cli -> lakehouse", "ingestion.cli -> lakehouse.**"]
unmatched_ignore_imports_alerting = "warn"

[[tool.importlinter.contracts]]
name = "lakehouse only depends on the schema (ingestion.schema), never on the parsers"
type = "forbidden"
source_modules = ["lakehouse"]
forbidden_modules = ["ingestion"]
ignore_imports = ["lakehouse -> ingestion.schema", "lakehouse.** -> ingestion.schema"]
unmatched_ignore_imports_alerting = "warn"

[[tool.importlinter.contracts]]
name = "ingestion.schema never imports the rest of ingestion (T14)"
type = "forbidden"
source_modules = ["ingestion.schema"]
forbidden_modules = ["ingestion"]

# orchestration (T21) wraps ingestion and lakehouse as Dagster assets, the
# same direction ingestion.cli already orchestrates both from; neither may
# import back into it.
[[tool.importlinter.contracts]]
name = "ingestion and lakehouse never import orchestration (T21 wraps, not the other way)"
type = "forbidden"
source_modules = ["ingestion", "lakehouse"]
forbidden_modules = ["orchestration"]

# alerting (Phase 7) only ever handles names and counts: it must not know how a
# statement is parsed or stored, and nothing depends on it.
[[tool.importlinter.contracts]]
name = "alerting is standalone: no parsers, no lake, no orchestration (ADR 0026)"
type = "forbidden"
source_modules = ["alerting"]
forbidden_modules = ["ingestion", "lakehouse", "orchestration"]
