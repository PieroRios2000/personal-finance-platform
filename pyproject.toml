[project]
name = "personal-finance-platform"
version = "0.1.0"
requires-python = ">=3.12"
dependencies = [
    "pdfplumber>=0.11.10",
    "pikepdf>=10.13.0.post1",
    "pydantic>=2.13.5",
    "pytesseract>=0.3.13",
]

[project.scripts]
pfp = "ingestion.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["ingestion", "lakehouse", "scripts"]

[dependency-groups]
dev = [
    "bandit>=1.9.4",
    "diff-cover>=10.5.1",
    "fpdf2>=2.8.8",
    "import-linter>=2.15",
    "mypy>=2.3.1",
    "pip-audit>=2.10.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff>=0.16.7",
]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.mypy]
strict = true

# pytesseract ships no type stubs or py.typed marker (T11b); no types-pytesseract
# package exists on PyPI either, so this is the standard mypy escape hatch for one
# untyped third-party import, scoped to that module only.
[[tool.mypy.overrides]]
module = "pytesseract"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-m 'not real_pdf'"
markers = [
    "real_pdf: runs against the owner's real PDFs; deselected by default (ADR 0004). Run with `pytest -m real_pdf`.",
]

[tool.coverage.run]
source = ["ingestion", "lakehouse", "scripts"]

# Architecture (reasons in CONSTRAINTS.md). Each contract forbids the whole package, and
# `ignore_imports` declares the one allowed dependency. While that import doesn't exist yet
# (it lands in T14), import-linter only warns "No matches" instead of failing.
[tool.importlinter]
root_packages = ["ingestion", "lakehouse"]

[[tool.importlinter.contracts]]
name = "Parsing does not import lakehouse (only ingestion.cli orchestrates both)"
type = "forbidden"
source_modules = ["ingestion"]
forbidden_modules = ["lakehouse"]
ignore_imports = ["ingestion.cli -> lakehouse", "ingestion.cli -> lakehouse.**"]
unmatched_ignore_imports_alerting = "warn"

[[tool.importlinter.contracts]]
name = "lakehouse only depends on the schema (ingestion.schema), never on the parsers"
type = "forbidden"
source_modules = ["lakehouse"]
forbidden_modules = ["ingestion"]
ignore_imports = ["lakehouse -> ingestion.schema", "lakehouse.** -> ingestion.schema"]
unmatched_ignore_imports_alerting = "warn"
