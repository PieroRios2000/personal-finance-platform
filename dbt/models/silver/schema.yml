version: 2

models:
  - name: transactions
    description: >
      Silver: one row per bank movement, typed and with its description
      re-normalized. Built from `bronze.transactions` (T16).
    data_tests:
      # T22 (ADR 0022): Elementary's own row-count anomaly detection, bucketed
      # by day (Elementary's own default `time_bucket`) on `date` -- the only
      # column value the check actually needs configured, since every other
      # parameter's default already fits this project (14 days back, a 2-day
      # backfill/detection window, `min_training_set_size: 7`, comfortably
      # under the 10-day training window `tests/test_elementary_anomaly_integration.py`
      # seeds). `severity: warn` (CONSTRAINTS.md's own warn-then-block
      # pattern): a real spike is worth surfacing every `dbt build`, but not
      # yet worth failing one on in a project with no operating history to
      # calibrate sensitivity against.
      - elementary.volume_anomalies:
          name: elementary_volume_anomalies_silver_transactions
          arguments:
            timestamp_column: "date"
          config:
            severity: warn
    columns:
      - name: user_id
        description: Who the movement belongs to (ADR 0009). Bronze's partition column.
        data_tests:
          - not_null
      - name: bank
        description: The bank the statement came from, e.g. BCP.
        data_tests:
          - not_null
      - name: account_id
        description: HMAC-SHA256 of the bank and the full account number (ADR 0005).
        data_tests:
          - not_null
      - name: account_last4
        description: The last 4 digits of the account number; the only part ever stored.
        data_tests:
          - not_null
      - name: date
        description: The date the bank posted the movement.
        data_tests:
          - not_null
      - name: description
        description: The movement's description, re-normalized (upper case, single spaces).
        data_tests:
          - not_null
      - name: amount
        description: Signed DECIMAL(18, 2); negative is a charge, positive a credit.
        data_tests:
          - not_null
      - name: currency
        description: The two currencies this project handles (`ingestion.schema.Currency`).
        data_tests:
          - not_null
          # `arguments:` rather than a top-level `values:`: dbt-core 1.10.5+
          # deprecated the older form (MissingArgumentsPropertyInGenericTest).
          - accepted_values:
              arguments:
                values: ["PEN", "USD"]
      - name: source_file_sha256
        description: sha256 of the PDF this movement was parsed from (T7); never its name.
        data_tests:
          - not_null
      - name: ingested_at
        description: When bronze wrote this row. Not null, but not a business key.
        data_tests:
          - not_null
      - name: account_kind
        description: >
          What this transaction's account balance represents: `asset` for money on
          hand (e.g. BCP checking), `liability` for debt owed (e.g. a Scotiabank
          credit card). Carried in from `bronze.statements` (ADR 0015), since it's a
          Statement-level fact, not a per-transaction one. `not_null` here also
          doubles as the check that every account's transactions matched exactly
          one statement row -- a left join with no match would surface as null,
          never silently.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["asset", "liability"]
      - name: is_internal_transfer
        description: >
          True for a movement matched to a transfer between two accounts of the
          same user (T18b, ADR 0017) -- never counted as an expense or income.
          Left join to `internal_transfer_matches` plus `coalesce(..., false)`:
          every transaction either is or isn't a transfer, with no null state.
        data_tests:
          - not_null
      - name: occurrence_number
        description: >
          T20: the last piece of the business key (`date` + `amount` +
          normalized `description` + `account_id` + `occurrence_number`,
          `brain/concepts/business-key.md`) -- a `row_number()` scoped to one
          `source_file_sha256` (`dbt/macros/occurrence_number.sql`) that
          disambiguates two otherwise-identical rows within the same
          statement. This model's own `unique_key`, so its MERGE knows two
          such rows are two separate movements, not one.
        data_tests:
          - not_null

  - name: internal_transfer_matches
    description: >
      T18b: one row per bronze.transactions row, with whether it's a plausible
      transfer candidate and, if matched, which other movement it paired with.
      The single shared computation `internal_transfers` and
      `unmatched_transfers` are both built from -- see its own docstring for
      the full matching algorithm and the account_kind-aware sign rule
      (ADR 0015).
    columns:
      - name: movement_id
        description: >
          A content-based identity for the underlying bronze.transactions row
          (md5 of every column except `ingested_at`; see the `movement_id`
          macro) -- bronze/transactions has no surrogate key of its own.
        data_tests:
          - not_null
      - name: user_id
        data_tests:
          - not_null
      - name: account_id
        data_tests:
          - not_null
      - name: date
        data_tests:
          - not_null
      - name: amount
        data_tests:
          - not_null
      - name: currency
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["PEN", "USD"]
      - name: account_kind
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["asset", "liability"]
      - name: is_transfer_candidate
        description: >
          True if this movement is within the amount/date-window neighborhood
          of at least one other account's row (any currency) under the
          account_kind-aware sign rule -- whether or not it ended up matched.
        data_tests:
          - not_null
      - name: is_internal_transfer
        description: True if this movement found a same-currency mutual match.
        data_tests:
          - not_null
      - name: amount_diff
        description: >
          How far this movement and its `matched_movement_id` are from an
          exact match under the account_kind-aware sign rule; null unless
          matched. Computed once here; `internal_transfers` reuses it rather
          than rederiving the same expression.
      - name: day_diff
        description: >
          Whole days between this movement and its `matched_movement_id`;
          null unless matched.

  - name: internal_transfers
    description: >
      T18b: one row per matched transfer pair, both legs' own details plus
      `day_diff`/`amount_diff`. Reshapes `internal_transfer_matches` from one
      row per movement to one row per pair -- no matching logic of its own.
      `assert_internal_transfers_are_one_to_one.sql` proves no movement_id
      appears across more than one row here.
    columns:
      - name: first_leg_movement_id
        data_tests:
          - not_null
          - unique
      - name: second_leg_movement_id
        data_tests:
          - not_null
          - unique
      - name: currency
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["PEN", "USD"]
      - name: day_diff
        description: Whole days between the two legs' own dates.
        data_tests:
          - not_null
      - name: amount_diff
        description: >
          How far the two legs are from an exact match under the
          account_kind-aware sign rule; 0 at the default zero tolerance.
        data_tests:
          - not_null

  - name: unmatched_transfers
    description: >
      T18b: transfer candidates (internal_transfer_matches.is_transfer_candidate)
      with no mutual match -- for a human to review, never dropped. Includes
      the unpaired half of a real transfer whose partner hasn't been ingested
      yet, and cross-currency candidates, which are never auto-matched (no FX
      conversion anywhere in this project) but must still surface here.
    columns:
      - name: movement_id
        data_tests:
          - not_null
          - unique
      - name: user_id
        data_tests:
          - not_null
      - name: account_id
        data_tests:
          - not_null
      - name: date
        data_tests:
          - not_null
      - name: amount
        data_tests:
          - not_null
      - name: currency
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["PEN", "USD"]
      - name: account_kind
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["asset", "liability"]

  - name: investment_entries
    description: >
      Silver (ADR 0028): the manual Excel's investment rows, typed and with the
      month they belong to. Empty (same columns) until a workbook with an
      `Inversiones` sheet is loaded. Not part of `silver.transactions`:
      investments are not spending or income and do not count toward the
      savings goal (ADR 0025).
    columns:
      - name: kind
        data_tests:
          - accepted_values:
              arguments:
                values: ["aporte", "retiro", "valorizacion"]
      - name: currency
        data_tests:
          - accepted_values:
              arguments:
                values: ["PEN", "USD"]
      - name: place
        data_tests:
          - not_null
      - name: month_start
        data_tests:
          - not_null
      - name: balance
        data_tests:
          - not_null

  - name: category_labels
    description: >
      Silver (T51, ADR 0043): the owner's confirmed or corrected category per
      `(bank, description)`. Empty (same columns) until a labeling file has been
      imported (`make import-category-labels`).
    columns:
      - name: bank
        data_tests:
          - not_null
      - name: description
        data_tests:
          - not_null
      - name: category
        data_tests:
          - not_null
      - name: is_trusted
        data_tests:
          - not_null

  - name: plan_fixed_items
    description: >
      Silver (T57, ADR 0048): the owner's plan of recurring expenses, one row per
      `(bank, description, currency)` with the `kind` he chose and his
      `expected_amount`. Empty (same columns) until a plan has been imported
      (`make import-plan`).
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [user_id, bank, description, currency]
    columns:
      - name: user_id
        data_tests:
          - not_null
      - name: kind
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [fixed, variable, ignore]
      - name: currency
        data_tests:
          - accepted_values:
              arguments:
                values: [PEN, USD]
      - name: expected_amount
        description: Required (and positive) for `fixed`, optional for the other kinds.
        data_tests:
          - not_null:
              config:
                where: "kind = 'fixed'"

  - name: plan_goal
    description: >
      Silver (T57, ADR 0048): the owner's savings goal in US dollars (`goal_currency`
      is always USD), the `usd_to_pen` rate (soles per dollar) and the emergency-fund
      settings; one row per user. Empty (same columns) until a plan has been imported.
    columns:
      - name: user_id
        data_tests:
          - not_null
          - unique
      - name: goal_amount
        data_tests:
          - not_null
      - name: usd_to_pen
        data_tests:
          - not_null
      - name: emergency_basis
        data_tests:
          - accepted_values:
              arguments:
                values: [all, fixed_only]

  - name: spend_forecasts
    description: >
      Silver (T59, ADR 0048): the forecast runs, one row per user, run (first day of
      the last closed month), `kind` ('backtest' = a past one-step forecast with its
      `actual`, 'forecast' = the next months), category, currency and target month.
      Empty (same columns) until `make forecast` has run.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              [user_id, run_month, kind, category, currency, target_month]
    columns:
      - name: user_id
        data_tests:
          - not_null
      - name: kind
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [backtest, forecast]
      - name: p50
        data_tests:
          - not_null

  - name: spend_forecast_series
    description: >
      Silver (T59, ADR 0048): how much to trust each forecast series of a run (model,
      history, origins, MAE relative to the baseline, interval coverage, flags). Empty
      (same columns) until `make forecast` has run.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [user_id, run_month, category, currency]
    columns:
      - name: user_id
        data_tests:
          - not_null
      - name: baseline_used
        data_tests:
          - not_null

  - name: goal_cashflow
    description: >
      Silver (T65, ADR 0048): the pieces of the savings projection per user, scenario,
      month index (1 to 120) and currency, in the currency they were earned or charged
      in. Empty (same columns) until `make forecast` has projected.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [user_id, scenario, month_index, currency]
    columns:
      - name: user_id
        data_tests:
          - not_null

  - name: goal_balances
    description: >
      Silver (T65, ADR 0048): what the projection starts from, per user, bucket
      (`emergency`, `other_liquid`, `risk`, and `essential` for the monthly essential
      spending) and currency. Empty (same columns) until `make forecast` has projected.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [user_id, bucket, currency]
    columns:
      - name: user_id
        data_tests:
          - not_null

  - name: goal_projection
    description: >
      Silver (T60, ADR 0048): the savings-goal path in US dollars, one row per user,
      scenario, line and month index. Empty (same columns) until `make forecast` has
      projected.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [user_id, scenario, line, month_index]
    columns:
      - name: user_id
        data_tests:
          - not_null
      - name: scenario
        data_tests:
          - accepted_values:
              arguments:
                values: [base, cautious, optimistic]
      - name: line
        data_tests:
          - accepted_values:
              arguments:
                values: [liquid, with_risk]

  - name: goal_summary
    description: >
      Silver (T60, ADR 0048): months to the goal and the saving it needs, one row per
      user, scenario and line. A null `months_to_goal` means not reached in 120 months.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [user_id, scenario, line]
    columns:
      - name: user_id
        data_tests:
          - not_null
      - name: scenario
        data_tests:
          - accepted_values:
              arguments:
                values: [base, cautious, optimistic]
      - name: line
        data_tests:
          - accepted_values:
              arguments:
                values: [liquid, with_risk]

  - name: emergency_fund
    description: >
      Silver (T60, ADR 0048): the emergency fund, one row per user and scenario.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [user_id, scenario]
    columns:
      - name: user_id
        data_tests:
          - not_null
      - name: target
        data_tests:
          - not_null

  - name: goal_headroom
    description: >
      Silver (T60, ADR 0048): the adjust view, one row per user, category and currency.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [user_id, category, currency]
    columns:
      - name: user_id
        data_tests:
          - not_null

  - name: category_predictions
    description: >
      Silver (T54, ADR 0045): the trained model's own guess per `(bank,
      description)`, batch-computed at ingest -- never the owner's confirmed
      answer. Empty (same columns) until a model has been trained and at least one
      ingest has run since.
    columns:
      - name: bank
        data_tests:
          - not_null
      - name: description
        data_tests:
          - not_null
      - name: category
        data_tests:
          - not_null
