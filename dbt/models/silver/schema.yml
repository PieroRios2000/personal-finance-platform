version: 2

models:
  - name: transactions
    description: >
      Silver: one row per bank movement, typed and with its description
      re-normalized. Built from `bronze.transactions` (T16).
    columns:
      - name: user_id
        description: Who the movement belongs to (ADR 0009). Bronze's partition column.
        data_tests:
          - not_null
      - name: bank
        description: The bank the statement came from, e.g. BCP.
        data_tests:
          - not_null
      - name: account_id
        description: HMAC-SHA256 of the bank and the full account number (ADR 0005).
        data_tests:
          - not_null
      - name: account_last4
        description: The last 4 digits of the account number; the only part ever stored.
        data_tests:
          - not_null
      - name: date
        description: The date the bank posted the movement.
        data_tests:
          - not_null
      - name: description
        description: The movement's description, re-normalized (upper case, single spaces).
        data_tests:
          - not_null
      - name: amount
        description: Signed DECIMAL(18, 2); negative is a charge, positive a credit.
        data_tests:
          - not_null
      - name: currency
        description: The two currencies this project handles (`ingestion.schema.Currency`).
        data_tests:
          - not_null
          # `arguments:` rather than a top-level `values:`: dbt-core 1.10.5+
          # deprecated the older form (MissingArgumentsPropertyInGenericTest).
          - accepted_values:
              arguments:
                values: ["PEN", "USD"]
      - name: source_file_sha256
        description: sha256 of the PDF this movement was parsed from (T7); never its name.
        data_tests:
          - not_null
      - name: ingested_at
        description: When bronze wrote this row. Not null, but not a business key.
        data_tests:
          - not_null
      - name: account_kind
        description: >
          What this transaction's account balance represents: `asset` for money on
          hand (e.g. BCP checking), `liability` for debt owed (e.g. a Scotiabank
          credit card). Carried in from `bronze.statements` (ADR 0015), since it's a
          Statement-level fact, not a per-transaction one. `not_null` here also
          doubles as the check that every account's transactions matched exactly
          one statement row -- a left join with no match would surface as null,
          never silently.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["asset", "liability"]
      - name: is_internal_transfer
        description: >
          True for a movement matched to a transfer between two accounts of the
          same user (T18b, ADR 0017) -- never counted as an expense or income.
          Left join to `internal_transfer_matches` plus `coalesce(..., false)`:
          every transaction either is or isn't a transfer, with no null state.
        data_tests:
          - not_null

  - name: internal_transfer_matches
    description: >
      T18b: one row per bronze.transactions row, with whether it's a plausible
      transfer candidate and, if matched, which other movement it paired with.
      The single shared computation `internal_transfers` and
      `unmatched_transfers` are both built from -- see its own docstring for
      the full matching algorithm and the account_kind-aware sign rule
      (ADR 0015).
    columns:
      - name: movement_id
        description: >
          A content-based identity for the underlying bronze.transactions row
          (md5 of every column except `ingested_at`; see the `movement_id`
          macro) -- bronze/transactions has no surrogate key of its own.
        data_tests:
          - not_null
      - name: user_id
        data_tests:
          - not_null
      - name: account_id
        data_tests:
          - not_null
      - name: date
        data_tests:
          - not_null
      - name: amount
        data_tests:
          - not_null
      - name: currency
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["PEN", "USD"]
      - name: account_kind
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["asset", "liability"]
      - name: is_transfer_candidate
        description: >
          True if this movement is within the amount/date-window neighborhood
          of at least one other account's row (any currency) under the
          account_kind-aware sign rule -- whether or not it ended up matched.
        data_tests:
          - not_null
      - name: is_internal_transfer
        description: True if this movement found a same-currency mutual match.
        data_tests:
          - not_null
      - name: amount_diff
        description: >
          How far this movement and its `matched_movement_id` are from an
          exact match under the account_kind-aware sign rule; null unless
          matched. Computed once here; `internal_transfers` reuses it rather
          than rederiving the same expression.
      - name: day_diff
        description: >
          Whole days between this movement and its `matched_movement_id`;
          null unless matched.

  - name: internal_transfers
    description: >
      T18b: one row per matched transfer pair, both legs' own details plus
      `day_diff`/`amount_diff`. Reshapes `internal_transfer_matches` from one
      row per movement to one row per pair -- no matching logic of its own.
      `assert_internal_transfers_are_one_to_one.sql` proves no movement_id
      appears across more than one row here.
    columns:
      - name: first_leg_movement_id
        data_tests:
          - not_null
          - unique
      - name: second_leg_movement_id
        data_tests:
          - not_null
          - unique
      - name: currency
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["PEN", "USD"]
      - name: day_diff
        description: Whole days between the two legs' own dates.
        data_tests:
          - not_null
      - name: amount_diff
        description: >
          How far the two legs are from an exact match under the
          account_kind-aware sign rule; 0 at the default zero tolerance.
        data_tests:
          - not_null

  - name: unmatched_transfers
    description: >
      T18b: transfer candidates (internal_transfer_matches.is_transfer_candidate)
      with no mutual match -- for a human to review, never dropped. Includes
      the unpaired half of a real transfer whose partner hasn't been ingested
      yet, and cross-currency candidates, which are never auto-matched (no FX
      conversion anywhere in this project) but must still surface here.
    columns:
      - name: movement_id
        data_tests:
          - not_null
          - unique
      - name: user_id
        data_tests:
          - not_null
      - name: account_id
        data_tests:
          - not_null
      - name: date
        data_tests:
          - not_null
      - name: amount
        data_tests:
          - not_null
      - name: currency
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["PEN", "USD"]
      - name: account_kind
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["asset", "liability"]
