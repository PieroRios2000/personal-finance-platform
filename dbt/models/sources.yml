version: 2

sources:
  - name: bronze
    description: >
      Append-only Delta tables written by `lakehouse/bronze.py` (T14), partitioned
      by `user_id` (ADR 0009) and located by `LAKEHOUSE_URI` (ADR 0006).
    meta:
      # dbt-duckdb resolves a source to whatever `external_location` says, and it
      # accepts a function call, not just a path — so `delta_scan()` is the whole
      # mechanism: no pre-hook, no staged view, no `dbt-duckdb` plugin. `{name}`
      # is filled in with each table's name below (str.format), while `{{ }}` is
      # rendered by dbt first. See ADR 0011.
      # https://github.com/duckdb/dbt-duckdb#reading-from-external-files
      external_location: "delta_scan('{{ env_var('LAKEHOUSE_URI').rstrip('/') }}/bronze/{name}')"
    tables:
      - name: transactions
        description: One row per bank movement, as parsed and reconciled from a statement PDF.
      - name: statements
        description: >
          One row per ingested statement period, with the balances and totals the
          PDF itself declares, `account_kind` (`asset`/`liability`, ADR 0015) --
          what that account's balance represents -- and `currency` (`PEN`/`USD`,
          ADR 0016). A single Scotiabank statement writes two rows here sharing
          `account_id` and `period_start`/`period_end`, one per currency (ADR
          0012), so the continuity test partitions by `currency` too, not just
          `user_id`/`account_id`. `silver.transactions` joins this table on
          `account_id` for `account_kind`.
      - name: investment_entries
        description: >
          The manual Excel's `Inversiones` sheet (ADR 0027, 0028): one row per
          contribution, withdrawal or month-end valuation of a fund or
          platform, in one currency. Only exists once a workbook with that sheet
          has been loaded (`pfp import-manual`); models on it use
          `bronze_table_exists` so a lake without it still builds.
