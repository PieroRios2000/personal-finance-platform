version: 2

sources:
  - name: bronze
    description: >
      Append-only Delta tables written by `lakehouse/bronze.py` (T14), partitioned
      by `user_id` (ADR 0009) and located by `LAKEHOUSE_URI` (ADR 0006).
    meta:
      # dbt-duckdb resolves a source to whatever `external_location` says, and it
      # accepts a function call, not just a path — so `delta_scan()` is the whole
      # mechanism: no pre-hook, no staged view, no `dbt-duckdb` plugin. `{name}`
      # is filled in with each table's name below (str.format), while `{{ }}` is
      # rendered by dbt first. See ADR 0011.
      # https://github.com/duckdb/dbt-duckdb#reading-from-external-files
      external_location: "delta_scan('{{ env_var('LAKEHOUSE_URI').rstrip('/') }}/bronze/{name}')"
    tables:
      - name: transactions
        description: One row per bank movement, as parsed and reconciled from a statement PDF.
      - name: statements
        description: >
          One row per ingested statement period, with the balances and totals the
          PDF itself declares, `account_kind` (`asset`/`liability`, ADR 0015) --
          what that account's balance represents -- and `currency` (`PEN`/`USD`,
          ADR 0016). A single Scotiabank statement writes two rows here sharing
          `account_id` and `period_start`/`period_end`, one per currency (ADR
          0012), so the continuity test partitions by `currency` too, not just
          `user_id`/`account_id`. `silver.transactions` joins this table on
          `account_id` for `account_kind`.
      - name: investment_entries
        description: >
          The manual Excel's `Inversiones` sheet (ADR 0027, 0028): one row per
          contribution, withdrawal or month-end valuation of a fund or
          platform, in one currency. Only exists once a workbook with that sheet
          has been loaded (`pfp import-manual`); models on it use
          `bronze_table_exists` so a lake without it still builds.
      - name: category_labels
        description: >
          The owner's confirmed or corrected transaction categories (T51, ADR 0043):
          one row per (bank, description) the labeling file covers, plus `is_trusted`
          (reviewer feedback, 2026-09-27) -- false exactly when the owner accepted
          the rules-based guesser's own suggestion unreviewed, so training/evaluation
          can avoid measuring the rules baseline against labels it produced itself.
          Only exists once `make import-category-labels` has run; models on it use
          `bronze_table_exists` too.
      - name: plan_fixed_items
        description: >
          The owner's savings plan, fixed-expense part (T57, ADR 0048): one row per
          (bank, description, currency) of the plan workbook, with the `kind` he chose
          (fixed / variable / ignore) and his `expected_amount`. Whole plan replaced on
          every `make import-plan`. Only exists once a plan has been imported; models on
          it use `bronze_table_exists` too.
      - name: plan_goal
        description: >
          The owner's savings goal in US dollars and the emergency-fund settings (T57,
          ADR 0048): one row per user, `usd_to_pen` is soles per dollar. Replaced with
          `plan_fixed_items` in the same import. Only exists once a plan has been
          imported; models on it use `bronze_table_exists` too.
      - name: spend_forecasts
        description: >
          The spend forecast (T59, ADR 0048): one row per (run_month, kind, category,
          currency, target_month), `kind` 'backtest' (a past one-step forecast with its
          actual) or 'forecast'. Replaced by (user_id, run_month) on every
          `make forecast`, so older runs stay for the monitor. Only exists once a
          forecast has run; models on it use `bronze_table_exists` too.
      - name: spend_forecast_series
        description: >
          Per series of a forecast run (T59, ADR 0048): the selected model, months of
          history, backtest origins, MAE relative to the baseline and interval
          coverage. Written with `spend_forecasts`; same existence rule.
      - name: goal_projection
        description: >
          The savings-goal path in US dollars (T60, ADR 0048): one row per scenario,
          line and month (0 to 120). Replaced as one set per user on every `make
          forecast`. Only exists once a projection has run; models on it use
          `bronze_table_exists` too.
      - name: goal_summary
        description: >
          Months to the goal and the saving it needs, per scenario and line (T60).
          Written with `goal_projection`; same existence rule.
      - name: emergency_fund
        description: >
          The emergency fund per scenario: target, bucket, gap, coverage and sanity
          flags (T60). Written with `goal_projection`; same existence rule.
      - name: goal_headroom
        description: >
          Per category, how far the forecast sits above the owner's usual (T60, spec
          4.5). Written with `goal_projection`; same existence rule.
      - name: category_predictions
        description: >
          The trained model's own guess for a movement's (bank, description),
          batch-computed at ingest (T54, ADR 0045) -- never the owner's confirmed
          answer, that's `category_labels` above. Whole set replaced on every ingest
          (`scripts.categorize_new_movements`), so it always reflects the latest
          trained model. Only exists once a model has been trained and at least one
          ingest has run since; models on it use `bronze_table_exists` too.
