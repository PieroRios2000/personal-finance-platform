version: 2

models:
  - name: dim_date
    description: >
      Gold (T23, widened in T34): the shared calendar, one row per day from the
      first day of the first month to the last day of the last month any fact has
      data for (movements, statement months, investment months). Continuous, so a
      month with no activity still has its days. See the model's own docstring.
    columns:
      - name: date
        description: The calendar date itself; this dimension's grain and primary key.
        data_tests:
          - not_null
          - unique
      - name: year_number
        data_tests:
          - not_null
      - name: quarter_number
        data_tests:
          - not_null
      - name: month_number
        data_tests:
          - not_null
      - name: month_name
        data_tests:
          - not_null
      - name: day_number
        data_tests:
          - not_null
      - name: day_name
        data_tests:
          - not_null
      - name: is_weekend
        data_tests:
          - not_null
      - name: month_start
        data_tests:
          - not_null
      - name: month_label
        description: Year and month like `2026-03`, for a month filter or axis.
        data_tests:
          - not_null
      - name: year_quarter
        description: Year and quarter like `2026-Q1`.
        data_tests:
          - not_null

  - name: dim_account
    description: >
      Gold (T23): one row per `account_id` that appears in
      silver.transactions -- this dimension's grain, confirmed as a plain
      dimension (no slowly-changing-dimension handling) in ADR 0020: an
      account's kind and bank are set once per parser (ADR 0015) and never
      change for a given account_id after the fact.
    columns:
      - name: account_id
        description: HMAC-SHA256 of the bank and the full account number (ADR 0005).
        data_tests:
          - not_null
          - unique
      - name: bank
        description: The bank the account belongs to, e.g. BCP.
        data_tests:
          - not_null
      - name: account_last4
        description: The last 4 digits of the account number; the only part ever stored.
        data_tests:
          - not_null
      - name: account_kind
        description: >
          What this account's balance represents: `asset` for money on
          hand (e.g. BCP checking), `liability` for debt owed (e.g. a
          Scotiabank credit card). See ADR 0015.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["asset", "liability"]

  - name: dim_bank
    description: >
      Gold (T23): one row per distinct bank name in silver.transactions --
      this dimension's grain. Kept separate from dim_account so a
      bank-level query can join fact_transactions straight to it, without
      going through account-level detail.
    columns:
      - name: bank
        description: The bank name, e.g. BCP or Scotiabank.
        data_tests:
          - not_null
          - unique

  - name: dim_user
    description: >
      Gold (T23): one row per distinct user_id in silver.transactions --
      this dimension's grain. This project's only user attribute is the id
      itself (brain/concepts/users-and-accounts.md).
    columns:
      - name: user_id
        description: Who the movement belongs to (ADR 0009).
        data_tests:
          - not_null
          - unique

  - name: dim_category
    description: >
      Spending/income categories (T51, ADR 0043): a fixed, short list the owner chose,
      seeded from dbt/seeds/category.csv, not derived from the movements. The natural
      key is `category` itself.
    columns:
      - name: category
        data_tests:
          - not_null
          - unique
          - accepted_values:
              values:
                - Servicios
                - Restaurantes
                - Alimentacion
                - Viajes
                - Transporte
                - Deporte
                - Ingresos
                - Transferencias
                - Entretenimiento
                - Salud
                - Ahorros
                - Cuidado Personal
                - Ropa
                - Educacion
                - Gastos varios

  - name: fact_transactions
    description: >
      Gold (T23): one row per silver.transactions business key (T20) --
      this fact table's grain, identical to silver.transactions' own, since
      this model is a straight select with no join that could fan a row
      out. Foreign keys into every dimension above; `amount`/`currency`/
      `date` stay as measures/degenerate attributes. `currency` is never
      collapsed or converted -- no FX, ever (tasks/plan-phase2.md's
      architecture decisions). `flow_type` standardizes direction
      (`ingreso`/`egreso`/`pago`) across BCP and Scotiabank's opposite raw
      sign conventions -- see the model's own docstring and ADR 0020 for
      the full mapping.
    columns:
      - name: user_id
        description: Who the movement belongs to (ADR 0009).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_user')
                field: user_id
      - name: account_id
        description: HMAC-SHA256 of the bank and the full account number (ADR 0005).
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_account')
                field: account_id
      - name: account_last4
        description: The account's last four digits, to tell accounts apart on a chart (not a key).
      - name: signed_amount
        description: >
          What the movement does to your position, the same on every bank (ADR 0031): money in
          and debt paid down are positive, money out and new debt are negative. `amount` keeps
          the bank's own sign, so it matches the statement; for a liability (a credit card)
          `signed_amount` is its opposite.
        data_tests:
          - not_null
      - name: bank
        description: The bank the statement came from, e.g. BCP.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_bank')
                field: bank
      - name: date
        description: The date the bank posted the movement.
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date
      - name: amount
        description: >
          Signed DECIMAL(18, 2); negative is a charge on an asset account
          or a payment/credit on a liability one, positive the opposite
          (`ingestion.schema.Transaction`). A measure, never collapsed
          across accounts without `flow_type`/`account_kind` in mind.
        data_tests:
          - not_null
      - name: currency
        description: >
          The two currencies this project handles. Never collapsed or
          converted into one number -- no FX anywhere in this project.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["PEN", "USD"]
      - name: description
        description: The movement's description, re-normalized (upper case, single spaces).
        data_tests:
          - not_null
      - name: occurrence_number
        description: >
          T20: the last piece of the business key, carried through from
          silver.transactions unchanged (`brain/concepts/business-key.md`).
        data_tests:
          - not_null
      - name: is_internal_transfer
        description: >
          True for a movement matched to a transfer between two accounts of
          the same user (T18b, ADR 0017), carried through from
          silver.transactions unchanged -- never counted as an expense or
          income. Every spend/income aggregate over fact_transactions
          should filter this to `false`, or a credit-card payment funded by
          a same-user transfer gets double-counted as an expense on one
          side and silently untouched on the other.
        data_tests:
          - not_null
      - name: flow_type
        description: >
          `ingreso` / `egreso` / `pago`, derived from `account_kind` +
          `amount`'s sign -- never each bank's own raw sign convention
          directly. See the model's own docstring and ADR 0020 for the
          exact mapping. Direction only: doesn't anticipate or touch Phase
          3's future `dim_category`.
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: ["ingreso", "egreso", "pago"]

  - name: fct_investment_monthly
    description: >
      Gold (ADR 0028): one row per investment (`place`), currency and calendar
      month of the manual Excel, with the month's gain (the balance change the
      owner's own contributions and withdrawals do not explain) and its
      Modified Dietz return. `return_pct` is null and `is_return_reliable` false
      for a month without a month-end valuation or one that follows a missing
      month. Funds and currencies are never mixed.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [user_id, place, currency, month_start]
    columns:
      - name: place
        data_tests:
          - not_null
      - name: month_start
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date

      - name: closing_balance
        data_tests:
          - not_null
      - name: is_return_reliable
        data_tests:
          - not_null

  - name: fct_account_balance_monthly
    description: >
      Gold (T32): one row per account, currency and calendar month, with the
      closing balance the statement declares (reconciled at ingestion). For the
      savings-balance chart; `account_kind` says whether the balance is money held
      (`asset`) or debt owed (`liability`). Currencies are never mixed.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [account_id, currency, month_start]
    columns:
      - name: account_id
        data_tests:
          - not_null
      - name: month_start
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date

      - name: closing_balance
        data_tests:
          - not_null
      - name: opening_balance
        description: The balance the month's statement opens with, as it declares it.
      - name: signed_opening_balance
        description: The opening balance as your position (a debt is negative), ADR 0031.
      - name: signed_closing_balance
        description: >
          Your position at the month's close (ADR 0031): a credit card's debt is negative, so
          the balances of all accounts add up to what you have. `closing_balance` keeps the
          statement's own value (the debt owed is positive).
        data_tests:
          - not_null

  - name: rpt_movements
    description: >
      Reporting table (T34): `fact_transactions` with the shared calendar's
      `calendar_year`, `calendar_quarter`, `calendar_month`, `calendar_month_name`
      and `calendar_day_name`, plus `category` (T51, ADR 0043) -- the owner's own
      label for the movement's `(bank, description)`, the trained model's own batch
      prediction for it (T54, ADR 0045) when there is no label yet, or
      'Sin categorizar' when neither exists -- and `category_confirmed`, true only
      for the owner's own label, so a chart or a query can tell a confirmed
      category apart from a proposed one. What the BI dashboard's movement charts
      read.
    columns:
      - name: calendar_month
        data_tests:
          - not_null
      - name: category
        data_tests:
          - not_null
      - name: category_confirmed
        data_tests:
          - not_null

  - name: rpt_balances
    description: >
      Reporting table (T34): `fct_account_balance_monthly` with the same
      `calendar_*` columns as every other reporting table, plus `month_recency`
      (1 = the latest month of the data, 2 = the one before).
    columns:
      - name: calendar_month
        data_tests:
          - not_null
      - name: month_recency
        data_tests:
          - not_null

  - name: rpt_investments
    description: >
      Reporting table (T34): `fct_investment_monthly` with the same `calendar_*`
      columns as every other reporting view.
    columns:
      - name: calendar_month
        data_tests:
          - not_null

  - name: rpt_capital
    description: >
      Reporting table (T35): your total capital per user, currency and month, savings
      (every asset account's closing balance) plus investments (every fund's month-end
      balance). A month a holding has no row keeps its last known balance. A debt is not
      capital: it is `debt_balance`, and `net_position` is capital minus debt. Same
      `calendar_*` columns and `month_recency` as the other reporting tables.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [user_id, currency, month_start]
    columns:
      - name: total_capital
        data_tests:
          - not_null
      - name: net_position
        data_tests:
          - not_null
      - name: calendar_month
        data_tests:
          - not_null

  - name: rpt_fixed_expenses
    description: >
      Reporting table (T57, ADR 0048): each expense the owner confirmed as fixed, with
      his `expected_amount`, the latest of the last six closed months in which it was
      charged (`last_observed_month`, `last_observed_amount`), `months_seen_last_6`,
      `deviation_pct` against the expected amount and a `status`: 'deviating' above
      10 % either way, 'as_expected', or 'not_seen' when it was not charged in the
      window. One row per `(user_id, bank, description, currency)`. Not monthly: the
      calendar filters do not apply to it. Carries `user_id` for row-level security.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [user_id, bank, description, currency]
    columns:
      - name: user_id
        data_tests:
          - not_null
      - name: expected_amount
        data_tests:
          - not_null
      - name: months_seen_last_6
        data_tests:
          - not_null
      - name: status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [as_expected, deviating, not_seen]

  - name: fct_spend_forecast
    description: >
      Fact (T59, ADR 0048): every forecast run, one row per user, `run_month`, `kind`,
      category, currency and `target_month`. `backtest` rows forecast a month that
      already closed, made without it, with its `actual`; `forecast` rows look ahead
      (horizon 1 to 3) with a null `actual`. `p10` and `p90` bound an 80 % interval
      from the model's own backtest errors (null when there are too few). Every run is
      kept so a forecast can be compared with the actual that arrives later. Carries
      `user_id` for row-level security; not monthly, no calendar filters.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns:
              [user_id, run_month, kind, category, currency, target_month]
    columns:
      - name: user_id
        data_tests:
          - not_null
      - name: kind
        data_tests:
          - accepted_values:
              arguments:
                values: [backtest, forecast]

  - name: rpt_category_variance
    description: >
      Reporting table (T59, ADR 0048): per category and currency of the latest forecast
      run, the last closed month's `actual` against the forecast made without it and
      its 80 % interval. `status` is 'above' over `p90`, 'below' under `p10`, 'within',
      or 'no_interval' when the series is too short for one. `months_above_last_6`
      counts the recent months that were above. The interval is optimistic (see
      `rpt_forecast_series_quality`). Carries `user_id` for row-level security.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [user_id, category, currency]
    columns:
      - name: user_id
        data_tests:
          - not_null
      - name: status
        data_tests:
          - not_null
          - accepted_values:
              arguments:
                values: [above, within, below, no_interval]

  - name: rpt_forecast_series_quality
    description: >
      Reporting table (T59, ADR 0048): per run, category and currency, the model
      selected, months of history, backtest origins, `mae_rel` (error relative to the
      median baseline, 1.0 = no better), the interval `coverage` (optimistic: measured
      on the errors the interval came from) and the flags `baseline_used` and
      `low_history`. How much to trust a forecast. Carries `user_id` for row-level
      security.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [user_id, run_month, category, currency]
    columns:
      - name: user_id
        data_tests:
          - not_null

  - name: rpt_category_forecast
    description: >
      Reporting table (T61, ADR 0048): what the dashboard shows of the forecast. The
      latest run only, per user, category, currency and horizon (1 to 3 months ahead):
      the interval (`p10`, `p50`, `p90`) and the quality of the series (model, whether
      the median baseline was used, months of history, `mae_rel`, `coverage`).
      Carries `user_id` for row-level security.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [user_id, category, currency, horizon]
    columns:
      - name: user_id
        data_tests:
          - not_null

  - name: rpt_goal_projection
    description: >
      Reporting table (T60, ADR 0048): the path to the savings goal in US dollars, one
      row per user, scenario, `line` ('liquid' counts liquid savings only, 'with_risk'
      adds the investments held flat) and month index (0 = the last closed month, up
      to 120): the emergency bucket and the progress toward the goal. Scenarios are
      the same assumptions throughout, not a confidence interval. Carries `user_id`
      for row-level security; not monthly, no calendar filters.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [user_id, scenario, line, month_index]
    columns:
      - name: user_id
        data_tests:
          - not_null
      - name: scenario
        data_tests:
          - accepted_values:
              arguments:
                values: [base, cautious, optimistic]
      - name: line
        data_tests:
          - accepted_values:
              arguments:
                values: [liquid, with_risk]

  - name: rpt_goal_summary
    description: >
      Reporting table (T60, ADR 0048): per user, scenario and line, `months_to_goal`
      (null = not reached in 120 months), `reached_month`, the saving the target date
      needs, the one projected, the `gap` between them and the share of that gap the
      adjust view's headroom could close. US dollars. Carries `user_id` for row-level
      security.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [user_id, scenario, line]
    columns:
      - name: user_id
        data_tests:
          - not_null

  - name: rpt_emergency_fund
    description: >
      Reporting table (T60, ADR 0048): per user and scenario, the emergency `target`
      (months of essential spending), the `bucket` held, the `gap`, `months_to_fill`,
      coverage in months, the savings rate and the sanity flags (essential spending
      over income, target over two years of income, balance not matching the flow).
      US dollars. Carries `user_id` for row-level security.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [user_id, scenario]
    columns:
      - name: user_id
        data_tests:
          - not_null

  - name: rpt_goal_headroom
    description: >
      Reporting table (T60, ADR 0048): the adjust view, per user, category and the currency
      it is charged in (`source_currency`) the forecast, the owner's usual (25th percentile of the last 12 months), the
      headroom between them and its share of the total. US dollars. Carries `user_id`
      for row-level security.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [user_id, category, source_currency]
    columns:
      - name: user_id
        data_tests:
          - not_null

  - name: rpt_reconciliation
    description: >
      Reporting table (T36): per account and currency, the opening balance of its first
      statement plus the movements up to its last closed statement against its closing
      balance. `difference` is 0 when every movement was read, none twice. Amounts are your
      position (a debt is negative). Only closed months. Not monthly: the calendar filters
      do not apply to it.
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: [user_id, account_id, currency]
    columns:
      - name: difference
        data_tests:
          - not_null
