# dbt-duckdb connection (T16, ADR 0011). Lives in the project directory, so every
# command needs `--profiles-dir dbt` as well as `--project-dir dbt`.
#
# Everything environment-specific comes from `.env` (see `.env.example`), the same
# variables `lakehouse/storage.py` reads, so dbt and the writer always point at the
# same lake. No value is defaulted except AWS_REGION: a missing credential should
# fail loudly here, exactly as it does in `storage_options()` (ADR 0006).

personal_finance_platform:
  # T27 (ADR 0029): silver and gold live in PostgreSQL. `PFP_DBT_TARGET=local` selects the
  # old DuckDB file (`dbt/pfp.duckdb`), which CI's base-vs-PR data diff still uses (T29).
  target: "{{ env_var('PFP_DBT_TARGET', 'postgres') }}"
  outputs:
    local: &duckdb_output
      type: duckdb
      # On disk, not `:memory:`: the built silver tables survive the run, so they
      # can be inspected (`duckdb dbt/pfp.duckdb`) and compared between runs
      # (T17b's data diff needs a DuckDB file per run). `*.duckdb` is gitignored.
      path: "{{ env_var('PFP_DUCKDB_PATH', 'dbt/pfp.duckdb') }}"
      schema: silver
      threads: 4
      extensions:
        - httpfs
        - delta
      # DuckDB's Secrets Manager, `PROVIDER config`, is what lets `delta_scan()`
      # reach a non-AWS, plain-HTTP S3 endpoint like SeaweedFS. ENDPOINT takes
      # host:port with no scheme; URL_STYLE 'path' mirrors delta-rs's
      # aws_virtual_hosted_style_request=false (ADR 0006). Without these three
      # options DuckDB silently talks to real AWS — see
      # tests/test_delta_scan_integration.py.
      # https://duckdb.org/docs/stable/core_extensions/httpfs/s3api
      secrets:
        - type: s3
          provider: config
          key_id: "{{ env_var('AWS_ACCESS_KEY_ID') }}"
          secret: "{{ env_var('AWS_SECRET_ACCESS_KEY') }}"
          region: "{{ env_var('AWS_REGION', 'us-east-1') }}"
          endpoint: "{{ env_var('AWS_ENDPOINT_URL').rstrip('/').split('://') | last }}"
          url_style: path
          use_ssl: "{{ 'true' if env_var('AWS_ENDPOINT_URL').startswith('https') else 'false' }}"

# T26 (ADR 0029): the same engine (DuckDB reading the lake), but silver and gold are
# stored in PostgreSQL through DuckDB's `attach`. Opt in with `--target postgres`
# (T27 makes it the default). `database:` is the alias of the attached Postgres, so
# every relation (silver.*, gold.*) is created there. Elementary keeps its own small
# DuckDB file (`elem`): its view models and its results upload do not work through
# the attach. The connection string is built from `.env` (PFP_PG_*); the password is
# escaped the way libpq expects (a backslash or quote in it is fine). Every variable has a
# default because dbt renders the target even when it only *parses* (Dagster's import, CI's
# `tests` job): the database and user default to `pfp`, the password to empty, and a real
# build with a wrong or missing one fails at connection time with Postgres's own message.
    postgres:
      <<: *duckdb_output
      path: ":memory:"
      database: "{{ env_var('PFP_PG_DATABASE', 'pfp') }}"
      extensions:
        - httpfs
        - delta
        - postgres
      attach:
        # A block scalar (no YAML escapes) so the Jinja filters below reach dbt as written:
        # they escape `\` and `'` in the password the way libpq's quoted values expect.
        - path: >-
            dbname={{ env_var('PFP_PG_DATABASE', 'pfp') }} host={{ env_var('PFP_PG_HOST', '127.0.0.1') }} port={{ env_var('PFP_PG_PORT', '5432') }} user={{ env_var('PFP_PG_USER', 'pfp') }} password='{{ env_var('PFP_PG_PASSWORD', '') | replace('\\', '\\\\') | replace("'", "\\'") }}'
          alias: "{{ env_var('PFP_PG_DATABASE', 'pfp') }}"
          type: postgres
        - path: "{{ env_var('PFP_ELEMENTARY_DUCKDB_PATH', 'dbt/elementary.duckdb') }}"
          alias: elem

# T22: the `elementary-data` CLI (`edr report`/`edr monitor`) runs its own
# internal dbt project against a connection profile literally named
# `elementary` -- confirmed directly (`edr report` fails with "Could not find
# profile named 'elementary'" without this block, even though `dbt build`
# above already populated every `elementary.*` table it needs). A YAML merge
# key (`<<: *duckdb_output`) reuses the exact same DuckDB file and S3 secrets
# as `personal_finance_platform` above, so `edr` reads what `dbt build` just
# wrote, not a second database or a second copy of this config to keep in
# sync — only `schema:` differs. `schema: elementary`, not `silver`: `edr`
# resolves "where do Elementary's own tables live" from *this* profile's own
# default schema, and `dbt_project.yml`'s `elementary: +schema: "elementary"`
# is what actually puts them there -- confirmed directly (`edr report` looked
# for `silver.elementary_test_results` and failed until this matched).
elementary:
  target: local
  outputs:
    local:
      <<: *duckdb_output
      schema: elementary
