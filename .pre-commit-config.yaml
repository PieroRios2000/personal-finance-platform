# Security guards that run before every commit (enable with `pre-commit install`).
repos:
  - repo: https://github.com/gitleaks/gitleaks
    rev: 83d9cd684c87d95d656c1458ef04895a7f1cbd8e  # frozen: v8.30.1
    hooks:
      - id: gitleaks
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: 3e8a8703264a2f4a69428a0aa4dcb512790b2c8c  # frozen: v6.0.0
    hooks:
      - id: detect-private-key
      - id: check-added-large-files
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: e8f7d69b957a30acb2c875078d5fd012de24b64c  # frozen: v0.16.7
    hooks:
      - id: ruff-check
        args: [--fix]
      - id: ruff-format
  # Second barrier in case someone forces a `git add -f` on an ignored file.
  - repo: local
    hooks:
      - id: forbid-data-files
        name: block PDFs and lake data
        language: fail
        entry: real data never goes into Git (it lives in ~/finance-data and the lake)
        files: (?i)\.(pdf|duckdb|parquet)$
